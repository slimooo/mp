# Analyses the pictures published on mee.plus (MeePlus/meeplus-next, scripts/shop-images/analyze.ts,
# docs/images-boutiques.md): a vision model of NVIDIA's API (kimi-k3) describes every published picture not
# analysed yet, and each answer is stored in media_analyses (the « fiche IA ») as soon as it arrives.
#
# Independent of the publication, which never waits for it. Runs every hour for 50 minutes at most; progress
# lives in the database, so each run carries on where the previous one stopped, and a run with nothing left
# ends at once.
#
# Secrets: MEEPLUS_DATABASE_URL, MEEPLUS_REPO_TOKEN, NVIDIA_API_KEY (see README.md).
name: Analyse IA des images

on:
  schedule:
    - cron: "7 * * * *"
  workflow_dispatch:
    inputs:
      apply:
        description: "Store the analyses (unchecked: dry run on 3 pictures, nothing written)"
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: meeplus-images-analyze
  cancel-in-progress: false

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      DATABASE_URL: ${{ secrets.MEEPLUS_DATABASE_URL }}
      NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
      RUN: ${{ (github.event_name != 'workflow_dispatch' || inputs.apply) && '--apply --max-minutes=50' || '--limit=3' }}
    steps:
      - name: Check secrets
        env:
          REPO_TOKEN: ${{ secrets.MEEPLUS_REPO_TOKEN }}
        run: |
          if [ -z "$DATABASE_URL" ] || [ -z "$REPO_TOKEN" ] || [ -z "$NVIDIA_API_KEY" ]; then
            echo "::error::Secrets MEEPLUS_DATABASE_URL, MEEPLUS_REPO_TOKEN and NVIDIA_API_KEY are required (see README.md)."
            exit 1
          fi
      - uses: actions/checkout@v4
        with:
          repository: MeePlus/meeplus-next
          token: ${{ secrets.MEEPLUS_REPO_TOKEN }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install
        run: |
          npm ci --no-audit --no-fund
          npx prisma generate
      - name: Analyse
        run: npm run images:analyze -- $RUN
